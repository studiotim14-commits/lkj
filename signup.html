<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project X - Sign Up</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css">
<style>
  .signup-page-wrap {
    flex: 1 0 auto;
    background-color: #e8e8e8;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
  }

  .signup-card {
    background-color: #ffffff;
    border: 1px solid #c8c8c8;
    border-radius: 4px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 520px;
    padding: 36px 44px;
    box-sizing: border-box;
  }

  .signup-title {
    font-size: 26px;
    font-weight: 600;
    color: #111;
    margin-bottom: 24px;
    text-align: center;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    color: #333;
    margin-bottom: 6px;
  }

  .form-input {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    background-color: #fafafa;
    transition: border-color 0.15s, background-color 0.15s;
  }

  .form-input:focus {
    outline: none;
    border-color: #00b05e;
    background-color: #fff;
  }

  .birthday-row {
    display: flex;
    gap: 10px;
  }

  .birthday-row select {
    flex: 1;
    padding: 9px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background-color: #fafafa;
  }

  .gender-row {
    display: flex;
    gap: 20px;
    margin-top: 8px;
  }

  .gender-label {
    font-weight: normal !important;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .btn-signup-submit {
    display: block;
    width: 100%;
    background: linear-gradient(to bottom, #02b757 0%, #018a41 100%);
    background-color: #02b757;
    color: #ffffff;
    font-size: 16px;
    font-weight: bold;
    padding: 12px;
    border: 1px solid #017035;
    border-radius: 4px;
    cursor: pointer;
    text-align: center;
    margin-top: 24px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 1px 3px rgba(0,0,0,0.15);
    transition: filter 0.15s;
  }

  .btn-signup-submit:hover {
    filter: brightness(1.08);
  }

  .login-prompt {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #666;
  }

  .login-prompt a {
    color: #008037;
    text-decoration: none;
    font-weight: bold;
  }

  .login-prompt a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="navbar">
    <div class="burger"><span></span><span></span><span></span></div>
    <img src="logo.png" alt="Logo" class="logo">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="catalog.html">Catalog</a>
      <a href="create.html">Create</a>
      <a href="#">Download</a>
    </div>
    <div class="search-wrap">
      <input type="text" placeholder="Search">
      <img src="finder.png" alt="Search" class="search-icon">
    </div>
    <div class="auth-links">
      <a href="#" class="login" id="loginBtn">Login</a>
      <a href="signup.html" class="signup">Sign Up</a>
    </div>
  </div>

  <div class="signup-page-wrap">
    <div class="signup-card">
      <h1 class="signup-title">Sign Up and Start Having Fun!</h1>
      
      <form id="registerForm">
        <div class="form-group">
          <label for="regUsername">Character Name (Username)</label>
          <input type="text" id="regUsername" class="form-input" placeholder="No real names, please!" required>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" class="form-input" placeholder="At least 8 characters" required minlength="8">
        </div>

        <div class="form-group">
          <label for="regMonth">Birthday</label>
          <div class="birthday-row">
            <select id="regMonth" required>
              <option value="">Month</option>
              <option value="01">January</option>
              <option value="02">February</option>
              <option value="03">March</option>
              <option value="04">April</option>
              <option value="05">May</option>
              <option value="06">June</option>
              <option value="07">July</option>
              <option value="08">August</option>
              <option value="09">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
            <select id="regDay" required>
              <option value="">Day</option>
              <option value="1">1</option><option value="2">2</option><option value="3">3</option>
              <option value="4">4</option><option value="5">5</option><option value="6">6</option>
              <option value="7">7</option><option value="8">8</option><option value="9">9</option>
              <option value="10">10</option><option value="11">11</option><option value="12">12</option>
              <option value="13">13</option><option value="14">14</option><option value="15">15</option>
              <option value="16">16</option><option value="17">17</option><option value="18">18</option>
              <option value="19">19</option><option value="20">20</option><option value="21">21</option>
              <option value="22">22</option><option value="23">23</option><option value="24">24</option>
              <option value="25">25</option><option value="26">26</option><option value="27">27</option>
              <option value="28">28</option><option value="29">29</option><option value="30">30</option>
              <option value="31">31</option>
            </select>
            <select id="regYear" required>
              <option value="">Year</option>
              <option value="2016">2016</option><option value="2015">2015</option><option value="2014">2014</option>
              <option value="2013">2013</option><option value="2012">2012</option><option value="2011">2011</option>
              <option value="2010">2010</option><option value="2009">2009</option><option value="2008">2008</option>
              <option value="2007">2007</option><option value="2006">2006</option><option value="2005">2005</option>
              <option value="2004">2004</option><option value="2003">2003</option><option value="2002">2002</option>
              <option value="2001">2001</option><option value="2000">2000</option><option value="1999">1999</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="regGender">Gender</label>
          <select id="regGender" class="form-input" required>
            <option value="">Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>

        <button type="submit" id="regSubmitBtn" class="btn-signup-submit">Sign Up</button>
      </form>

      <div class="login-prompt">
        Already have an account? <a href="#" id="openLoginFromSignup">Log In</a>
      </div>
    </div>
  </div>

  <div class="chat-container" id="chatWidget">
    <div class="chat-header" id="chatHeader">Chat</div>
    <div class="chat-body">
      <div class="chat-messages">
        <div class="chat-empty-msg">No recent messages</div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">About Us</a>
      <a href="#">Discord</a>
      <a href="#">Robux Exchange</a>
      <a href="#">Tix Exchange</a>
      <a href="#">Terms</a>
      <a href="#">Privacy</a>
    </div>
    <div class="footer-copyright">© 2026 — This project is not affiliated with, endorsed by, or connected to Roblox Corporation in any way.</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
